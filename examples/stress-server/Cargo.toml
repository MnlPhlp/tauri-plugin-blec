[package]
name = "stress-server"
version = "0.1.0"
edition = "2021"
description = "Scriptable chaos BLE GATT peripheral for stress-testing tauri-plugin-blec"

[workspace]

[dependencies]
anyhow = "1.0"
bluer = { version = "0.17", features = ["bluetoothd"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
uuid = "1.11"
