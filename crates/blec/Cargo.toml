[package]
name = "blec"
version = "0.15.0"
description = "Cross platform BLE client for rust, with an android backend that needs no gradle"
readme = "README.md"
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
btleplug.workspace = true
tokio.workspace = true
uuid.workspace = true
once_cell.workspace = true
tracing.workspace = true
futures.workspace = true
enumflags2.workspace = true
async-trait.workspace = true
tokio-stream.workspace = true
base64.workspace = true

# TODO(core-split): the android backend still talks to kotlin through tauri's
# mobile plugin IPC. Replaced by a JNI bridge in the next step, after which this
# dependency goes away and the crate is host agnostic on every target.
[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2.0.6", features = ["wry"] }

[features]
# Replaces the platform BLE backend with an in-process mock (see `blec::mock`).
# Meant for tests and for running an app without Bluetooth hardware. Desktop targets only.
mock = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-linux-android",
  "x86_64-apple-ios",
]
