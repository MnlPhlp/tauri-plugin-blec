[workspace]
resolver = "2"
members = ["crates/*"]
# The examples are standalone crates with their own lockfiles (and, for the
# tauri ones, their own npm projects), not workspace members.
exclude = ["examples"]

[workspace.package]
license = "MIT OR Apache-2.0"
authors = ["Manuel Philipp"]
edition = "2021"
rust-version = "1.80.0"
repository = "https://github.com/MnlPhlp/tauri-plugin-blec"
homepage = "https://github.com/MnlPhlp/tauri-plugin-blec"

[workspace.dependencies]
serde = "1.0"
serde_json = "1"
thiserror = "2.0"
btleplug = { version = "0.13", features = ["serde"] }
tokio = "1.40.0"
uuid = "1.11.0"
once_cell = "1.20.2"
tracing = "0.1.40"
futures = { version = "0.3.31", default-features = false }
enumflags2 = { version = "0.7", features = ["serde"] }
async-trait = "0.1.83"
tokio-stream = "0.1.16"
base64 = "0.22.1"
